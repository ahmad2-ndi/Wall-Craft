services:
  postgres:
    image: postgres:16-alpine
    container_name: wall-crafter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wall_crafter
      POSTGRES_USER: wall_crafter
      POSTGRES_PASSWORD: wall_crafter_dev_password
    ports:
      - "5432:5432"
    volumes:
      - wall_crafter_pgdata:/var/lib/postgresql/data

volumes:
  wall_crafter_pgdata:
